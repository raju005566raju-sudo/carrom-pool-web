name: carrom_pool
description: "A Premium Luxury Carrom Pool Game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  firebase_core: ^4.11.0
  firebase_database: ^12.4.3
  flutter_tts: ^4.0.2
  image_picker: ^1.2.2
  shared_preferences: ^2.5.5
  nakama: ^1.3.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/board.png
    - assets/images/black coin.png
    - assets/images/white coin.png
    - assets/images/red coin.png
    - assets/images/sticker.png
    - assets/sounds/boundary_heat.mp3
    - assets/sounds/Carrom_pool_pocket.mp3
    - assets/sounds/Carrom_pool_start.mp3
    - assets/sounds/coin_to_coin_heat.mp3
    - assets/sounds/sticker_move.mp3